spring.application.name=receita-de-voinha-api
server.port=8080

# Banco H2 em memoria: nao precisa instalar nada. Os dados voltam ao estado
# inicial (data.sql) toda vez que a API reinicia.
spring.datasource.url=jdbc:h2:mem:voinha;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false

# Origens liberadas no CORS (separe por virgula). Padrao: front do Vite.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
