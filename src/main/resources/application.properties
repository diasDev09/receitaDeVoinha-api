spring.application.name=receita-de-voinha-api
server.port=8080

# Variáveis locais (DB_URL, DB_USER, DB_PASSWORD...) podem ficar num arquivo .env
# na raiz do projeto. Ele está no .gitignore; o modelo é o .env.example.
spring.config.import=optional:file:.env[.properties]

# Banco de dados
# - Sem DB_URL: H2 em memória (modo PostgreSQL). Nada para instalar; os dados
#   voltam ao estado inicial a cada reinício.
# - Com DB_URL: PostgreSQL do Supabase. Os dados ficam salvos entre reinícios.
spring.datasource.url=${DB_URL:jdbc:h2:mem:voinha;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Tabelas no schema "voinha" (e não no "public"): o Supabase expõe o "public"
# pela API REST automática dele, e aqui só a nossa API deve acessar os dados.
spring.flyway.schemas=voinha
spring.flyway.default-schema=voinha
spring.jpa.properties.hibernate.default_schema=voinha

# Quem cria e altera as tabelas é o Flyway (src/main/resources/db/migration).
# O Hibernate só confere se as entidades batem com as tabelas, e o
# inicializador de scripts (data.sql/schema.sql) fica desligado.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Origens liberadas no CORS (separe por virgula). Padrao: front do Vite.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
